repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # PHẢI khớp ruff trong pyproject.toml [dev] — hai phiên bản khác
    # nhau sẽ cho kết quả khác nhau giữa máy lập trình viên và hook.
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
