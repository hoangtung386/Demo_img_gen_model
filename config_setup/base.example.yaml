# ╔══════════════════════════════════════════════════════════════════════╗
# ║  FILE MẪU — copy sang base.yaml rồi điền thông số thật.               ║
# ║      cp config_setup/base.example.yaml config_setup/base.yaml         ║
# ║  base.yaml (chứa secret) bị .gitignore chặn — KHÔNG commit.           ║
# ╠══════════════════════════════════════════════════════════════════════╣
# ║  PHẦN 1 — CONFIG CHUNG MỌI AI SERVICE (BE/DevOps chỉnh)              ║
# ║  rabbitmq + storage — đồng nhất giữa các service trong org. BE và    ║
# ║  DevOps quản lý 2 nhóm này: tên queue, broker host, GCS bucket,      ║
# ║  CDN domain. Service AI khác (face-swap, remove-object…) cùng        ║
# ║  pattern, chỉ thay tên queue + bucket cụ thể.                        ║
# ╚══════════════════════════════════════════════════════════════════════╝

service_version: "v0.1.0"

rabbitmq:
  # ── BE-relevant: tên queue/exchange + broker connection ──
  # Điền thông số broker thật (DevOps cấp). KHÔNG commit giá trị thật.
  host: ""              # vd "qas-google.example.com"
  port: 5672
  user: ""              # vd "google_cloud_amb"
  password: ""          # secret — điền lúc deploy
  vhost: ""             # vd "future_self"
  exchange: "predict-ai-gen-image"
  queues_in:
    premium: "gen-image-queue-in-premium"
    basic_1: "gen-image-queue-in-basic-tier-1"
    basic_2: "gen-image-queue-in-basic-tier-2"
    basic_3: "gen-image-queue-in-basic-tier-3"
  queue_out: "gen-image-queue-out"
  queue_out_key: "gen-image-queue-out"
  # 3 modes:
  # "declare"         → service tự tạo full topology: exchange main/.retry/.dlq
  #                      + 4 inbound queue có `x-dead-letter-exchange` args
  #                      + retry sibling (TTL) + DLQ sibling cho mỗi tier.
  #                      Failure routing dùng broker DLX. Yêu cầu BE/DevOps
  #                      chấp nhận args trên queue HOẶC queue chưa tồn tại.
  #                      Hit case `PRECONDITION_FAILED 406` nếu BE đã pre-create
  #                      queue legacy KHÔNG có DLX → consumer crash.
  # "declare_minimal" → service tạo TỐI GIẢN: exchange main + 4 inbound queue
  #                      + 1 outbound queue + 5 bind. KHÔNG DLX args, KHÔNG
  #                      retry/.dlq queue. Tương thích queue BE pre-create.
  #                      Failure path → AI reply qua queue_out + ack message
  #                      gốc; audit trail trên disk
  #                      (`data_predict/<service>/{fail,error}`).
  #                      KHUYẾN NGHỊ cho QAS/PRD khi chạy song song BE legacy.
  # "passive"         → service chỉ verify queues đã tồn tại, fail-fast nếu
  #                      thiếu. Dùng khi DevOps muốn kiểm soát toàn quyền
  #                      topology.
  topology_mode: "declare_minimal"

  # ── Advanced (BE thường KHÔNG đụng — giữ default) ──
  # Prefetch per-consumer-channel: 4 tier (premium + basic_1/2/3) → 4
  # channel/container. prefetch_count=1 → 4 unacked/container = fair
  # distribution multi-container. Service GPU 1 worker, sinh ảnh Lightning
  # p95 ~5-8s → buffer nhỏ là đủ; container khác lấy phần còn lại trên broker.
  # prefetch_count=0 → auto-tune = clamp(target_sla/avg_inference, 1, prefetch_max).
  prefetch_count: 1
  target_sla_seconds: 120.0    # informational khi prefetch_count > 0
  avg_inference_seconds: 8.0   # informational khi prefetch_count > 0
  prefetch_max: 8              # cap cho auto-tune (chỉ áp dụng prefetch_count=0)
  heartbeat: 600
  # Reconnect exponential backoff + jitter.
  reconnect_initial_seconds: 1.0
  reconnect_max_seconds: 60.0
  reconnect_jitter: 0.2
  # Proactive broker healthcheck.
  broker_healthcheck_interval_seconds: 15.0
  broker_healthcheck_timeout_seconds: 3.0
  # Retry / DLQ topology (idempotent declared lúc startup).
  retry_exchange_suffix: ".retry"
  dlq_suffix: ".dlq"
  # retry_max_attempts: 0 → MỌI lỗi (PERMANENT + TRANSIENT) đều DLQ ngay
  #   sau attempt đầu tiên. Không có loop retry. Đơn giản, predictable.
  #   Đặt > 0 (vd 3) nếu service muốn auto-recover từ transient (network
  #   blip, GCS 5xx); KHI đó pipeline phải đảm bảo HTTP 4xx classify sang
  #   PERMANENT (xem storage/gcs.py).
  retry_max_attempts: 0
  retry_initial_delay_ms: 5000

storage:
  backend: "gcs"                      # implementation: "gcs" | "local"
  default_index: 0                    # backend dùng khi inbound không gửi `storage_index`
  # Multi-backend list. Inbound `storage_index` (int) chọn entry, default
  # = `default_index`. `cdn_base_url` rỗng → trả signed URL của bucket;
  # có giá trị → trả URL CDN public `{cdn_base_url}/{object_key}`.
  # Đặt key upload (bucket cho user) vào config_setup/credentials/
  # user-upload-key.json rồi trỏ `credentials_path` tới nó (KHÔNG commit
  # key thật). Key download model nội bộ là file KHÁC: xem app.gcs_key_file.
  backends:
    - credentials_path: "config_setup/credentials/user-upload-key.json"
      bucket: ""                      # vd "ai-bucket-v5"
      folder: ""                      # vd "media-dev/temp"
      feature: "gen-image"
      signed_url_ttl_minutes: 15
      cdn_base_url: ""

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  PHẦN 2 — CONFIG NỘI BỘ AI (BE KHÔNG ĐỤNG, để mặc định)              ║
# ║  processor + worker + observability + audit — đặc trưng cho mỗi      ║
# ║  service AI. BE/DevOps để như dưới đây; chỉ AI team chỉnh khi        ║
# ║  benchmark / debug. Default values cover 95% trường hợp.             ║
# ╚══════════════════════════════════════════════════════════════════════╝

# FLUX.2-klein-9B inference. Các knob ở đây map thẳng vào
# gen_image.config.Settings — service queue nạp model qua loader chung.
processor:
  type: "flux2_klein"
  device: ""                    # rỗng → auto (cuda:1 nếu >=2 GPU, else cuda:0)
  num_steps: 4                  # bản distilled được chưng cất về đúng 4 bước
  # "gguf" (mặc định) | "bf16". FLUX.2-klein-9B BF16 đầy đủ cần ~29GB VRAM;
  # dùng GGUF Q4_K_M (~5.9GB transformer) để vừa các GPU 24GB. GGUF giải nén
  # về bf16 trong forward — tức đổi dung lượng lấy băng thông. GGUF cũng KHÔNG
  # torch.compile được (diffusers#10795).
  #
  # Không chạy nhiều process 9B trên một L4; quyết định bằng số đo của
  # scripts/benchmark.py.
  # Thêm lựa chọn thứ ba: "fp8" (optimum-quanto). L4 là Ada (sm_89) nên CÓ
  # tensor core FP8 thật — khác GGUF, không phải giải nén trong forward.
  # CHƯA ĐƯỢC ĐO: cần `uv sync --extra fp8` rồi so bằng
  # `python scripts/spike_flux2.py --modes bf16 fp8` trước khi bật.
  quantization: "gguf"
  # --- Bộ nhớ VAE -------------------------------------------------------
  # Cả hai mặc định TẮT; bật khi độ phân giải cao hoặc benchmark chỉ ra cần.
  # không thiếu. Bật khi: chạy trên 1024², hoặc nhồi nhiều process/GPU, hoặc
  # `make benchmark` cho thấy decode là phần đáng kể của VRAM đỉnh.
  vae_tiling: false             # decode latent theo ô — giảm VRAM đỉnh
  vae_slicing: false            # chỉ có tác dụng khi batch > 1 (hiện là 1)
  # Số prompt giữ trong cache embed. Mỗi entry vài MB, nâng lên hàng trăm
  # vẫn rẻ so với 24GB. Tăng khi `make benchmark` cho thấy `text` chiếm tỉ
  # trọng lớn VÀ prompt của user lặp lại nhiều.
  embed_cache_size: 8
  # torch.compile transformer. Mặc định TẮT. Chiều ảnh ra suy từ tỉ lệ ảnh
  # người dùng nên gần như mỗi request một shape mới; compile chỉ có lãi khi
  # đã xác nhận số lần recompile hội tụ về 0 (chạy với TORCH_LOGS=recompiles).
  # Chỉ có tác dụng ở nhánh quantization="bf16".
  compile_transformer: false
  # "resident" (mặc định) → mọi component thường trú trên GPU, không một lần
  #   chuyển CPU<->GPU nào lúc suy luận. Đúng cho L4 24GB.
  # "model_offload" → weight ở CPU, kéo lên GPU theo từng module lúc forward.
  #   Chậm hơn đáng kể; chỉ dùng khi card nhỏ hơn L4 hoặc cần nhiều process
  #   worker trên cùng card.
  offload: "resident"
  # Bản distilled nhúng guidance vào model thay vì chạy CFG hai nhánh, nên
  # giá trị này KHÔNG bật negative_prompt và cũng không nhân đôi chi phí
  # denoise. 1.0 là giá trị của model card.
  guidance_scale: 1.0
  output_area: 1048576          # 1024*1024 — diện tích ảnh ra mặc định
  # Trần pixel cho MỖI CHIỀU (width, height) của ảnh input tham chiếu. Vượt
  # trần KHÔNG bị từ chối — pipeline tự resize (giữ tỉ lệ, không phóng) về
  # khung này. Không ảnh hưởng VRAM/tốc độ GPU (Flux2KleinPipeline vốn đã tự
  # thu ảnh tham chiếu xuống <=1024*1024), chỉ chặn RAM/băng thông lúc decode
  # ảnh cực lớn bằng PIL.
  max_input_dimension: 1280
  warmup: true                  # trả trước chi phí lượt sinh đầu tiên lúc startup
  # Rỗng → tải từ HuggingFace Hub (cần mạng, LỖI nếu HF_HUB_OFFLINE=1 và
  # chưa có sẵn trong cache). Đặt đường dẫn TRONG container (mount ./models
  # ở docker-compose.yml) để dùng trọng số model-fetcher đã kéo sẵn từ GCS —
  # bắt buộc trên production, vì service này KHÔNG đọc biến môi trường
  # GENIMG_*, chỉ đọc field dưới đây từ base.yaml.
  base_model_local: "/app/models/FLUX.2-klein-9B"
  # Bắt buộc khi quantization="gguf" trong container offline.
  transformer_gguf: "/app/models/gguf/flux-2-klein-9b-Q4_K_M.gguf"

worker:
  num_ai_workers: 1
  in_queue_capacity: 2
  publish_queue_capacity: 5000
  basic_tier_weights: [5, 3, 2]
  recent_requests_capacity: 1000

observability:
  log_level: "INFO"
  log_payload_max_bytes: 500
  strip_url_query: true

audit:
  service_name: "model_gen_img"
  root_dir: "data_predict"
  staging_dir: "data/staging"
  retention_days: 7
  cleanup_interval_hours: 6
  enabled: true
  save_input_image: true
  save_output_image: true
  compute_checksum: true

# ╔══════════════════════════════════════════════════════════════════════╗
# ║  PHẦN 3 — CONFIG APP GRADIO + DOWNLOAD MODEL                         ║
# ║  Gộp từ config/example.env cũ. Nguồn config DUY NHẤT cho serve.py,   ║
# ║  download.py và các script model (fetch/pack). Mọi key vẫn có thể    ║
# ║  override bằng biến môi trường GENIMG_* / HF_TOKEN / MODEL_ROOT.     ║
# ╚══════════════════════════════════════════════════════════════════════╝
app:
  # --- Runtime / inference (serve.py + download.py) --- (env: GENIMG_*)
  # Dùng cho CẢ HAI: `serve.py` chạy trực tiếp (không Docker) LẪN service
  # Docker `gen-image`, service này mount config_setup/:/app/config_setup:ro
  # nên đọc đúng file base.yaml thật của host. Copy file này thành base.yaml
  # rồi điền giá trị, đừng sửa thẳng bản .example (bản thật đã .gitignore,
  # KHÔNG commit).
  num_steps: 4                  # GENIMG_NUM_STEPS
  guidance_scale: 1.0           # GENIMG_GUIDANCE_SCALE
  quantization: "gguf"          # GENIMG_QUANTIZATION — gguf | bf16 | fp8
  vae_tiling: false             # GENIMG_VAE_TILING
  vae_slicing: false            # GENIMG_VAE_SLICING
  embed_cache_size: 8           # GENIMG_EMBED_CACHE_SIZE
  compile_transformer: false    # GENIMG_COMPILE
  device: ""                    # GENIMG_DEVICE — rỗng auto (cuda:1 nếu >=2 GPU)
  offload: "resident"           # GENIMG_OFFLOAD — resident | model_offload
  warmup: true                  # GENIMG_WARMUP
  demo_cache: true              # GENIMG_DEMO_CACHE

  # --- Model source (download.py) ---
  model_root: "models"                              # MODEL_ROOT
  # PHẢI là bản distilled. "FLUX.2-klein-base-9B" là repo KHÁC: không
  # distilled, cần vài chục bước và guidance thật, chậm hơn ~4 lần ở cùng
  # cấu hình. Preflight cảnh báo nếu model_index.json thiếu is_distilled.
  base_model: "black-forest-labs/FLUX.2-klein-9B"   # GENIMG_BASE_MODEL
  # Chỉ dùng khi quantization="gguf".
  gguf_repo: "unsloth/FLUX.2-klein-9B-GGUF"         # GENIMG_GGUF_REPO
  gguf_file: "flux-2-klein-9b-Q4_K_M.gguf"          # GENIMG_GGUF_FILE
  base_model_local: ""          # GENIMG_BASE_MODEL_LOCAL
  transformer_gguf: ""          # GENIMG_TRANSFORMER_GGUF

  # --- Server / UI (serve.py) ---
  server_name: "0.0.0.0"        # GENIMG_SERVER_NAME
  server_port: 7860             # GENIMG_PORT

  # --- HuggingFace --- (secret: set qua env HF_TOKEN, đừng commit)
  hf_token: ""                  # HF_TOKEN

  # --- Nguồn trọng số cho Docker (GCS fetch_models.sh) ---
  models_uri: ""                # GENIMG_MODELS_URI — gs://bucket/path
  # Key download model nội bộ (đường dẫn TRONG container: /credentials).
  gcs_key_file: "/credentials/model-download-key.json"   # GENIMG_GCS_KEY_FILE
  models_force: false           # GENIMG_MODELS_FORCE
