[project]
name = "gen-image-flux2-klein"
version = "0.2.0"
description = "FLUX.2-klein-9B GGUF image generation service (RabbitMQ worker + Gradio demo)"
readme = "README.md"
# Trần < 3.14 giữ lại cho torch: bánh xe torch 2.9.0 chỉ dựng tới cp313.
# (Trần này KHÔNG còn liên quan tới nunchaku — package đó đã bị gỡ hẳn.)
requires-python = ">=3.10,<3.14"
dependencies = [
    "gradio==6.24.0",
    "torch==2.9.0",
    # Flux2KleinPipeline xuất hiện từ 0.37; ghim dải 0.40.x vì đó là bản đã
    # kiểm: `image=` optional, `max_sequence_length=512`, `is_distilled` đọc
    # từ model_index.json, và from_single_file chấp nhận `config=`+`subfolder=`
    # (đường né diffusers#13001 — xem models/loader.py).
    "diffusers>=0.40.0,<0.41",
    # Qwen3ForCausalLM (text encoder của klein) + Qwen2TokenizerFast.
    "transformers==5.15.0",
    # Dùng tường minh trong models/placement.py (enable_model_cpu_offload là
    # đường lùi khi OOM). Trước đây package này vào máy nhờ diffusers kéo
    # theo — một dependency ngầm, hỏng ngay khi diffusers đổi ý.
    "accelerate>=1.0",
    # Chỉ cần cho nhánh quantization="gguf". Nhẹ (thuần Python), giữ trong
    # nhóm mặc định để một image duy nhất chạy được cả hai nhánh.
    "gguf>=0.10",
    # Lượng tử hoá text encoder Qwen3-8B (text_encoder_quantization="nf4",
    # MẶC ĐỊNH). Ở nhóm mặc định chứ không phải extra: không có nó thì cấu
    # hình mặc định của service KHÔNG chạy được trên L4 24GB — 16.4 GiB text
    # encoder bf16 cộng transformer là vượt VRAM. 0.45 là bản đầu tiên có
    # kernel NF4 ổn định cho Ada/sm_89.
    "bitsandbytes>=0.45",
    "huggingface-hub==1.27.0",
    "python-dotenv==1.2.2",
    "pillow==12.3.0",
    # --- Queue-worker service (gen_image.queue_service) -------------------
    # Gộp vào nhóm mặc định để MỘT image duy nhất chạy được cả Gradio demo
    # lẫn RabbitMQ consumer (main_queue.py). Các package này nhẹ, không kéo
    # theo CUDA/torch.
    "pika==1.3.2",
    "loguru==0.7.3",
    "pyyaml==6.0.2",
    "psutil==6.1.1",
    "google-cloud-storage==2.19.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.3",
    "pytest==9.1.1",
]
# Chỉ cần cho `quantization: "fp8"` — một nhánh CHƯA ĐƯỢC ĐO (xem
# models/loader.py::_load_fp8_transformer). Để ngoài nhóm mặc định nên image
# production không mang theo một dependency chưa ai chứng minh là có lợi;
# cài thêm khi muốn so FP8 với bf16 trên L4:
#     uv sync --extra fp8 && python scripts/spike_flux2.py --modes bf16 fp8
fp8 = [
    # torchao là backend FP8 CHÍNH. Float8DynamicActivationFloat8WeightConfig
    # lượng tử hoá cả activation nên matmul chạy thật trên tensor core FP8
    # của Ada (sm_89).
    "torchao>=0.9",
    # optimum-quanto: backend CŨ, giữ lại chỉ để tái lập kết quả đã đo.
    # Trên Colab L4 nó nổ "RuntimeError: A is not contiguous" trong kernel
    # Marlin FP8 ngay ở forward đầu tiên, và diffusers 0.40 đã deprecate cả
    # QuantoConfig lẫn QuantoQuantizer (gỡ ở 1.0). Đừng chọn nhánh này.
    "optimum-quanto>=0.2.6",
    # quanto biên dịch extension C++/CUDA NGAY LÚC NẠP model, và bước đó cần
    # ninja. Thiếu nó thì nhánh quanto chết bằng "RuntimeError: Ninja is
    # required to load C++ extensions" — một thông báo không hề nhắc tới
    # quanto hay fp8, nên rất dễ bị đọc nhầm thành "FP8 không chạy được
    # trên máy này".
    "ninja>=1.11",
]

[project.scripts]
download-model = "gen_image.download:main"
run-app = "gen_image.serve:main"
run-queue = "gen_image.queue_service.app:_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gen_image"]

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
# 88 = mặc định của ruff/Black. Trước đây khai 79 nhưng chưa bao giờ được
# enforce: `queue_service/` và `scripts/` vốn đã viết ở ~88, và 313 lỗi E501
# tồn đọng khiến `ruff check` luôn đỏ — tức là không ai chạy được nó, tức là
# nó không bảo vệ gì cả. Hạ chuẩn xuống đúng thực tế rồi giữ nó XANH có giá
# trị hơn một con số đẹp mà cả repo phải phớt lờ.
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
