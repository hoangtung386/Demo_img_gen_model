services:
  # ---------------------------------------------------------------------
  # Kéo trọng số từ GCS, chạy một lần rồi thoát. App chờ nó thành công mới
  # khởi động (depends_on: service_completed_successfully bên dưới).
  #
  # Thay hẳn cho đường HuggingFace: không HF_TOKEN, không accept license lúc
  # deploy, không phụ thuộc hub còn sống hay không. Đặt QIE_MODELS_URI trong
  # .env; bỏ trống thì compose báo lỗi ngay chứ không chạy với models rỗng.
  # ---------------------------------------------------------------------
  model-fetcher:
    build:
      context: .
      dockerfile: Dockerfile.fetch
    image: qwen-lightning-fetch:0.1.0
    container_name: qwen-lightning-fetch
    environment:
      # Mặc định ghim sẵn nên KHÔNG cần .env: clone repo, thả
      # ai-asset-amb.json vào gốc, `docker compose up` là chạy. Đặt biến
      # QIE_MODELS_URI trong môi trường để trỏ sang archive khác.
      QIE_MODELS_URI: "${QIE_MODELS_URI:-gs://ai-model-new-amb/models.zip}"
      QIE_MODELS_DIR: /models
      QIE_GCS_KEY_FILE: "${QIE_GCS_KEY_FILE:-/secrets/gcs-key.json}"
      QIE_MODELS_FORCE: "${QIE_MODELS_FORCE:-false}"
    volumes:
      # rw: đây là service DUY NHẤT được ghi vào models/.
      - ./models:/models
      # Gốc repo, read-only: fetch_models.sh dò key service account ở đây
      # (ai-asset-amb.json). Mount cả thư mục chứ không trỏ thẳng vào file —
      # bind mount vào một file không tồn tại thì Docker lặng lẽ tạo ra một
      # THƯ MỤC cùng tên và lỗi hiện ra ở chỗ khó hiểu.
      - .:/project:ro
      # Mount cả THƯ MỤC chứ không phải file key: thư mục thì Docker tạo được
      # nếu chưa có, còn trỏ bind mount vào một file không tồn tại thì Docker
      # lặng lẽ tạo ra một thư mục cùng tên và script đọc key thành lỗi khó
      # hiểu. Thư mục rỗng => script tự rơi về ADC, đúng cách khi VM trên GCE
      # đã gắn service account (không có file key nào để rò rỉ).
      - ./secrets:/secrets:ro
    restart: "no"

  qwen-lightning:
    build:
      context: .
      dockerfile: Dockerfile
    image: qwen-lightning:0.1.0
    container_name: qwen-lightning

    # Yêu cầu host: driver NVIDIA >= 525 (torch cu128 chạy nhờ CUDA minor
    # version compatibility) và nvidia-container-toolkit đã cài + đăng ký
    # runtime với Docker. Kiểm tra trước khi build:
    #   docker run --rm --gpus all nvidia/cuda:12.8.0-base-ubuntu22.04 nvidia-smi
    gpus: all

    ports:
      - "${HOST_PORT:-7860}:7860"

    # Trọng số đã nằm sẵn ở ./models nhờ model-fetcher. App không khởi động
    # nếu bước đó hỏng — thà dừng còn hơn chạy rồi đổ traceback sau 2 phút
    # nạp model, hoặc tệ hơn là lặng lẽ tải 65GB từ Hub.
    depends_on:
      model-fetcher:
        condition: service_completed_successfully

    # .env là TUỲ CHỌN: bản deploy trên GCE không cần file nào cả — trọng số
    # do model-fetcher kéo từ GCS, HF_TOKEN không dùng tới. Có .env thì nó
    # vẫn được nạp để ghi đè khi cần chạy tay.
    env_file:
      - path: .env
        required: false

    # Ghi đè lên env_file cho những giá trị chỉ đúng bên trong container.
    environment:
      QIE_SERVER_NAME: "0.0.0.0"
      QIE_PORT: "7860"

      # Không còn biến QIE_SHARE: app luôn dựng link *.gradio.live và dừng
      # hẳn nếu không dựng được. Container vẫn publish 0.0.0.0:7860 như cũ,
      # nên trong LAN cứ vào thẳng IP:7860 — link công khai là đường thứ hai
      # chạy song song, KHÔNG có xác thực. Đặt firewall cho tương xứng.

      # .model_paths.env ghi đường dẫn tuyệt đối trên host nên vô nghĩa ở đây
      # (đã loại khỏi image qua .dockerignore). Trỏ thẳng vào chỗ mount.
      # Đổi QIE_RANK / QIE_NUM_STEPS / QIE_PRECISION thì sửa tên file này theo.
      QIE_BASE_MODEL_LOCAL: /app/models/Qwen-Image-Edit-2509
      QIE_TRANSFORMER_PATH: /app/models/lightning-251115/svdq-int4_r32-qwen-image-edit-2509-lightning-4steps-251115.safetensors

      # --- Một card A100-40GB -------------------------------------------
      # Tổng weight resident đo được là 26.4 GiB (text_encoder 15.4 +
      # transformer INT4 10.7 + vae 0.24), vừa trong 39 GiB của A100 với
      # ~13 GiB dư cho activation. 'none' giữ mọi component nằm lại trên GPU:
      # không có lần chuyển CPU<->GPU nào lúc sinh ảnh.
      #
      # KHÔNG để 'auto' ở đây dù logic auto đã biết chọn đúng: production nên
      # tự quyết định thay vì phụ thuộc vào dò phần cứng lúc chạy.
      # Card nhỏ hơn 32 GiB thì đổi thành 'model' (chậm hơn nhiều, ~41s/ảnh).
      QIE_OFFLOAD: "none"
      QIE_DEVICE: "cuda:0"

      # A100 là Ampere (sm_80) -> bắt buộc INT4. Chỉ Blackwell (sm_120/121)
      # mới dùng FP4; nunchaku sẽ raise ValueError nếu đặt sai.
      QIE_PRECISION: "int4"

      # Toàn bộ weight đã nằm ở /app/models. Khoá Hub lại để một biến env
      # thiếu không biến thành lần tải 65GB âm thầm giữa production.
      HF_HOME: /app/.hf_cache
      HF_HUB_OFFLINE: "1"
      # Không có gì cần tải nên không cần token trong container. env_file nạp
      # cả .env nên phải ghi đè tường minh để token không đi vào môi trường
      # tiến trình.
      HF_TOKEN: ""

      # Allocator co giãn: kích thước ảnh ra thay đổi theo tỉ lệ ảnh người
      # dùng nên mỗi request cấp phát một shape khác nhau. Không có cờ này
      # thì phân mảnh sẽ đẩy service tới OOM dù VRAM còn trống.
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

      # Trả trước chi phí lượt sinh ảnh đầu tiên lúc khởi động, để người dùng
      # đầu tiên không phải chờ nạp cubin + dựng CUDA context.
      QIE_WARMUP: "true"

    volumes:
      # Trọng số read-only: container này chỉ đọc. Ghi vào đây là việc của
      # model-fetcher. Sau khi bỏ 5 shard transformer BF16 không dùng tới
      # thì còn ~26GB.
      - ./models:/app/models:ro
      # Cache HF ghi được (thực tế rỗng vì HF_HUB_OFFLINE=1) + chỗ Gradio
      # ghi file tạm.
      - hf-cache:/app/.hf_cache

    shm_size: "1gb"

    # Makefile dò phần cứng và set biến này: một GPU hoặc A100 => coi là
    # server production => 'unless-stopped'. Máy nhiều GPU (bàn dev) giữ 'no'
    # để app crash thì dừng hẳn, không bị restart lặp che mất traceback gốc.
    # Ghi đè tay:  make run QIE_RESTART_POLICY=no
    restart: "${QIE_RESTART_POLICY:-no}"

volumes:
  hf-cache:
